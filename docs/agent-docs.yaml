project:
  package: "@tribalnerd/pi-notes"
  purpose: "Pi extension and CLI for project/global Markdown notes"
  refs:
    - package.json
    - src/index.ts
    - src/cli.ts

entrypoints:
  pi_extension:
    path: extensions/pi-notes/index.ts
    implementation: src/index.ts
    refs:
      - extensions/pi-notes/index.ts
      - src/index.ts
  cli:
    path: src/cli.ts
    built: dist/src/cli.js
    refs:
      - src/cli.ts
      - package.json

architecture:
  boundaries:
    note: "Package shim delegates to Pi adapter; Pi adapter uses commands/core; CLI uses commands."
    refs:
      - .fallowrc.json
      - extensions/pi-notes/index.ts
      - src/index.ts
      - src/cli.ts
  command_routing:
    note: "Slash commands, tools, and CLI share parser and handlers."
    refs:
      - src/commands/notes.ts
      - src/commands/handlers/index.ts
  storage_boundary:
    note: "Storage validates roots, containment, entry types, and note lifecycle."
    refs:
      - src/core/storage.ts
      - src/core/naming.ts
  coordination:
    note: "Injected coordinator uses Pi queue or process-local fallback."
    refs:
      - src/core/mutation.ts
      - src/index.ts
  output_recovery:
    note: "Truncated tool output uses private bounded-retention artifacts."
    refs:
      - src/core/output-artifact.ts
      - src/index.ts

runtime_flows:
  outcomes:
    note: "Handlers report success, failure, or cancellation separately from UI severity."
    refs:
      - src/commands/context.ts
      - src/commands/notes.ts
  extension_storage:
    note: "Extension injects host config directory and Pi mutation queue."
    refs:
      - src/index.ts
      - src/core/storage.ts
  headless_commands:
    note: "Print/JSON direct commands throw an observable CLI handoff."
    refs:
      - src/index.ts
      - tests/modes.test.ts
  cli:
    note: "CLI defaults to .pi and maps failed outcomes to nonzero status."
    refs:
      - src/cli.ts
      - tests/cli.test.ts

contracts:
  command_grammar:
    refs:
      - src/commands/parser.ts
      - src/commands/shared.ts
      - tests/parser.test.ts
  storage_safety:
    refs:
      - src/core/storage.ts
      - tests/storage.test.ts
  tool_contract:
    refs:
      - src/index.ts
      - tests/tools.test.ts
  package_contract:
    refs:
      - package.json
      - tests/package-resources.test.ts

state:
  project_notes:
    path: "<cwd>/<CONFIG_DIR_NAME>/notes"
    refs:
      - src/index.ts
      - src/core/storage.ts
  global_notes:
    path: "~/<CONFIG_DIR_NAME>/notes"
    refs:
      - src/index.ts
      - src/core/storage.ts
  cli_default:
    path: ".pi/notes and ~/.pi/notes"
    refs:
      - src/cli.ts
      - src/core/storage.ts

integrations:
  pi:
    note: "Registers command/tools and uses host config, queue, truncation, and error APIs."
    refs:
      - src/index.ts
      - package.json
  agent_skill:
    refs:
      - skills/pi-notes/SKILL.md
      - package.json

validation:
  required_checks:
    - npm run lint
    - npm run typecheck
    - npm run test
    - npm run test:coverage
    - npm run build
  boundary_tests:
    refs:
      - tests/storage.test.ts
      - tests/mutation.test.ts
      - tests/pi-queue-integration.test.ts
      - tests/tools.test.ts
      - tests/modes.test.ts
      - tests/package-resources.test.ts
      - tests/workflows.test.ts

operations:
  build:
    note: "Regenerate dist with npm run build; do not hand-edit generated files."
    refs:
      - package.json
      - tsconfig.build.json
  release:
    note: "Published release or main-ref manual tag route verifies tag/version before provenance publish."
    refs:
      - .github/workflows/publish.yml
      - package.json

constraints:
  safety:
    - "Reject unsafe names, symlinks, wrong path types, and containment escapes."
    - "Keep destructive and overwrite operations human-confirmed."
    - "Do not claim cross-process CLI coordination."
  refs:
    - src/core/storage.ts
    - src/core/mutation.ts
    - src/commands/shared.ts

glossary:
  project_scope: "Notes under the current project host config directory."
  global_scope: "Notes under the home host config directory."
  local_queue: "Process-local mutation serialization used outside Pi host injection."
  refs:
    - src/core/storage.ts
    - src/core/mutation.ts

open_questions: []
