name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish (vX.Y.Z)
        required: true
        type: string

jobs:
  publish:
    if: github.event_name == 'release' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package version
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";

          const tag = process.env.RELEASE_TAG ?? "";
          const version = JSON.parse(readFileSync("package.json", "utf8")).version;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Release tag must use vX.Y.Z form: ${tag}`);
          }
          if (tag.slice(1) !== version) {
            throw new Error(`Release tag ${tag} does not match package version ${version}`);
          }
          console.log(`Verified ${tag} matches package version ${version}.`);
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gate
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Show package metadata being published
        run: npm pkg get name version publishConfig.access

      - name: OIDC preflight note
        run: |
          echo "Trusted publishing auth is established during npm publish."
          echo "Preflight commands like 'npm whoami' may return 401 before publish and are not used here."

      - name: Publish to npm with provenance
        run: npm publish --provenance
