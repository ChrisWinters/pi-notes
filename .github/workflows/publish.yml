name: Publish

on:
  push:
    branches: ["release"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Quality gate
        run: npm run lint && npm run typecheck && npm run test && npm run build

      - name: Show package metadata being published
        run: npm pkg get name version publishConfig.access

      - name: OIDC preflight note
        run: |
          echo "Trusted publishing auth is established during npm publish."
          echo "Preflight commands like 'npm whoami' may return 401 before publish and are not used here."

      - name: Publish to npm with provenance
        run: npm publish --provenance
